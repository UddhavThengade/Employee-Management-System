{% extends 'base.html' %}{% block title %}Attendance{% endblock %}{% block content %}
<h1 class="page-title mb-4">Attendance</h1><div class="panel mb-3"><form method="get" class="row g-2 align-items-end"><div class="col-md-4"><label class="form-label">Date</label><input class="form-control" type="date" name="attendance_date" value="{{ day }}"></div><div class="col-auto"><button class="btn btn-outline-primary">View</button></div></form></div>
<div class="panel mb-3"><h5>Mark attendance</h5><form method="post" class="row g-2 align-items-end"><input type="hidden" name="attendance_date" value="{{ day }}"><div class="col-md-5"><label class="form-label">Employee</label><select class="form-select" name="employee_id" required><option value="">Select employee</option>{% for p in people %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"><option>Present</option><option>Absent</option><option>Leave</option></select></div><div class="col-md-3"><button class="btn btn-primary w-100">Save attendance</button></div></form></div>
<div class="panel"><h5>Records for {{ day }}</h5><table class="table mt-3"><thead><tr><th>Employee</th><th>Status</th></tr></thead><tbody>{% for r in records %}<tr><td>{{ r.name }}</td><td>{{ r.status }}</td></tr>{% else %}<tr><td colspan="2">No attendance records.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
