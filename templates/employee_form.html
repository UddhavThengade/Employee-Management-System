{% extends 'base.html' %}{% block title %}Employee Form{% endblock %}{% block content %}
<h1 class="page-title mb-4">{{ 'Edit' if employee else 'Add' }} Employee</h1><div class="panel"><form method="post" class="row g-3">
<div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" name="name" required value="{{ employee.name if employee else '' }}"></div>
<div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" required value="{{ employee.email if employee else '' }}"></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ employee.phone if employee else '' }}"></div>
<div class="col-md-6"><label class="form-label">Department</label><select class="form-select" name="department_id"><option value="">Select department</option>{% for d in departments %}<option value="{{ d.id }}" {% if employee and employee.department_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Job title</label><input class="form-control" name="job_title" value="{{ employee.job_title if employee else '' }}"></div>
<div class="col-md-6"><label class="form-label">Monthly salary (INR)</label><input class="form-control" type="number" min="0" step="0.01" name="salary" value="{{ employee.salary if employee else 0 }}"></div>
<div class="col-md-6"><label class="form-label">Joining date</label><input class="form-control" type="date" name="joining_date" value="{{ employee.joining_date if employee and employee.joining_date else '' }}"></div>
<div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status"><option {% if not employee or employee.status=='Active' %}selected{% endif %}>Active</option><option {% if employee and employee.status=='Inactive' %}selected{% endif %}>Inactive</option></select></div>
<div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-light" href="{{ url_for('employees') }}">Cancel</a></div></form></div>{% endblock %}
