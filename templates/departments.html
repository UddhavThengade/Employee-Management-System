{% extends 'base.html' %}{% block title %}Departments{% endblock %}{% block content %}
<h1 class="page-title mb-4">Departments</h1><div class="row g-4"><div class="col-lg-4"><div class="panel"><h5>Add department</h5><form method="post"><input class="form-control my-3" name="name" placeholder="Department name" required><button class="btn btn-primary w-100">Add</button></form></div></div>
<div class="col-lg-8"><div class="panel"><h5 class="mb-3">Department list</h5><table class="table"><thead><tr><th>Department</th><th>Employees</th></tr></thead><tbody>{% for d in departments %}<tr><td>{{ d.name }}</td><td>{{ d.employee_count }}</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
